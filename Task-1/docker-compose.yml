x-api-env: &api-env
  DATABASE_URL: postgresql://callzo:${POSTGRES_PASSWORD:-callzo_dev_password}@db:5432/callzo
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-callzo_test_secret_change_me}
  API_KEY: ${API_KEY:-dev_api_key_change_me}
  MONTHLY_CAP_CENTS: ${MONTHLY_CAP_CENTS:-300}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callzo_dev_password}
      POSTGRES_DB: callzo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callzo -d callzo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: api
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  simulator:
    image: meetrj/callzo-webhook-simulator
    container_name: simulator
    depends_on:
      api:
        condition: service_healthy
    command: ["--url", "http://api:8000/webhooks/calls", "--scenario", "all"]

  # Run with: docker compose --profile test run --rm tests
  tests:
    build: .
    profiles: ["test"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "pip install --no-cache-dir -q -r requirements-dev.txt && pytest -q"

volumes:
  pgdata:
