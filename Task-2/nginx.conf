server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html must be revalidated so a rebuild's new asset hash is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Hashed bundles never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Proxy API calls to the mock API on the Docker network.
  # The browser reaches Nginx; Nginx reaches mock-api via Docker DNS.
  location /api/ {
    proxy_pass http://mock-api:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }
}
